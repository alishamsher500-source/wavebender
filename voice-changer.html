<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVEBENDER — Voice FX Console</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#06070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WaveBender">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #06070c;
    --bg-2: #0d1120;
    --glass: rgba(255,255,255,0.045);
    --glass-hover: rgba(255,255,255,0.075);
    --glass-strong: rgba(255,255,255,0.09);
    --line: rgba(255,255,255,0.10);
    --line-soft: rgba(255,255,255,0.06);
    --violet: #8b5cf6;
    --blue: #4d8dff;
    --cyan: #22e8d0;
    --magenta: #ff4d7d;
    --amber: #ffb454;
    --green: #4ade80;
    --text: #f3f5fb;
    --muted: #8891a8;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}

  /* ---------- Light theme override ---------- */
  html[data-theme="light"]{
    --bg-1: #eef1fa;
    --bg-2: #e3e8f6;
    --glass: rgba(20,24,40,0.045);
    --glass-hover: rgba(20,24,40,0.075);
    --glass-strong: rgba(20,24,40,0.12);
    --line: rgba(20,24,40,0.12);
    --line-soft: rgba(20,24,40,0.07);
    --violet: #7c3aed;
    --blue: #2563eb;
    --cyan: #0891a3;
    --magenta: #db2777;
    --amber: #b45309;
    --green: #16a34a;
    --text: #14151f;
    --muted: #5b6478;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(circle at 15% -10%, rgba(124,58,237,0.10), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(8,145,163,0.08), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(37,99,235,0.06), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
  }
  html[data-theme="light"] body::before{
    background-image:
      linear-gradient(rgba(20,24,40,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,24,40,0.05) 1px, transparent 1px);
  }
  html[data-theme="light"] .brand h1{
    background:linear-gradient(90deg, #201b38, #6d4fd1);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  html[data-theme="light"] .fx .star{ color:rgba(20,24,40,0.18); }
  /* ---------- End light theme override ---------- */
  ::selection{background:rgba(139,92,246,0.35);}
  body{
    margin:0;
    transition: background .35s ease;
    background:
      radial-gradient(circle at 15% -10%, rgba(139,92,246,0.16), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(34,232,208,0.12), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(77,141,255,0.08), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    padding:20px 14px 70px;
  }

  /* ---------- Theme toggle ---------- */
  .theme-switch{
    position:relative; z-index:1;
    display:flex; gap:4px; padding:4px;
    max-width:960px; margin:0 auto 14px;
    background:var(--glass); border:1px solid var(--line); border-radius:999px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 20px rgba(0,0,0,0.25);
  }
  .theme-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--display); font-weight:600; font-size:13px; letter-spacing:0.2px;
    padding:11px 16px; border-radius:999px; border:none; cursor:pointer;
    background:transparent; color:var(--muted);
    transition: background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .theme-btn svg{width:15px; height:15px; flex-shrink:0;}
  .theme-btn:hover{color:var(--text);}
  .theme-btn.active{
    color:#fff;
    background:linear-gradient(90deg, var(--violet), var(--blue));
    box-shadow:0 6px 16px -4px rgba(139,92,246,0.55);
  }
  .theme-btn.active:hover{color:#fff;}
  .theme-btn:focus-visible, .btn:focus-visible, .fx:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }
  /* ---------- End theme toggle ---------- */

  /* faint grid backdrop for a HUD feel */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  }

  .brand{
    position:relative; z-index:1;
    display:flex;align-items:center;justify-content:space-between;
    max-width:960px;margin:0 auto 16px;padding:14px 20px;
    background:var(--glass);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.35);
  }
  .brand-plate{display:flex; align-items:center; gap:12px;}
  .logo-mark{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 18px rgba(139,92,246,0.55), 0 0 4px rgba(34,232,208,0.4);
  }
  .logo-mark svg{width:18px; height:18px;}
  .brand-text{display:flex; flex-direction:column; gap:2px;}
  .brand h1{
    font-family:var(--display); font-weight:700; letter-spacing:0.5px;
    font-size:19px; margin:0; line-height:1;
    background:linear-gradient(90deg, #ffffff, #c9c2ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .sub{font-family:var(--mono); font-size:9.5px; color:var(--muted); letter-spacing:2.5px; text-transform:uppercase;}

  .console{
    position:relative; z-index:1;
    max-width:960px;margin:0 auto; display:grid; gap:16px;
  }
  .module{
    background:var(--glass);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line); border-radius:18px; padding:20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.3);
  }
  .module-label{
    font-family:var(--mono); font-size:10px; letter-spacing:2.5px; color:var(--muted);
    text-transform:uppercase; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;
  }
  .module-label span.tag{
    color:var(--cyan); background:rgba(34,232,208,0.1); border:1px solid rgba(34,232,208,0.25);
    padding:3px 9px; border-radius:20px; letter-spacing:1.5px;
  }

  /* Transport module */
  .transport{display:grid; grid-template-columns: auto 1fr; gap:22px; align-items:center;}
  @media (max-width:640px){ .transport{grid-template-columns:1fr;} }
  .transport-controls{display:flex; gap:10px; flex-wrap:wrap;}

  .btn{
    font-family:var(--display); letter-spacing:0.3px; font-weight:600;
    border:1px solid var(--line); background:var(--glass); color:var(--text);
    padding:11px 18px; border-radius:999px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; gap:8px; transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--glass-strong); background:var(--glass-hover); transform:translateY(-1px);}
  .btn:active{transform:scale(0.96) translateY(0);}
  .btn:disabled{opacity:0.3; cursor:not-allowed; transform:none;}

  .btn.record{
    border-color:rgba(255,77,125,0.35); color:#ffc2d4;
    background:linear-gradient(180deg, rgba(255,77,125,0.12), rgba(255,77,125,0.04));
  }
  .btn.record:hover{border-color:rgba(255,77,125,0.6);}
  .btn.record.active{
    background:linear-gradient(180deg, rgba(255,77,125,0.25), rgba(255,77,125,0.08));
    border-color:var(--magenta); color:#fff;
    animation:pulse 1.3s infinite;
  }
  .btn.primary{
    border-color:rgba(77,141,255,0.4); color:#bcd4ff;
    background:linear-gradient(180deg, rgba(77,141,255,0.14), rgba(77,141,255,0.04));
  }
  .btn.primary:hover{border-color:var(--blue);}
  .btn.gold{
    border-color:rgba(139,92,246,0.4); color:#d8caff;
    background:linear-gradient(180deg, rgba(139,92,246,0.16), rgba(139,92,246,0.05));
  }
  .btn.gold:hover{border-color:var(--violet);}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor; box-shadow:0 0 8px currentColor;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,125,0.45);}50%{box-shadow:0 0 0 8px rgba(255,77,125,0);}}

  .readout{
    font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:14px;
    display:flex; gap:18px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--line-soft);
  }
  .readout b{color:var(--text); font-weight:500;}

  canvas#scope{
    width:100%; height:100px; border-radius:12px; background:rgba(0,0,0,0.35);
    border:1px solid var(--line); display:block;
    box-shadow:inset 0 0 24px rgba(139,92,246,0.06);
  }

  /* Effects grid */
  .cat{margin-bottom:22px;}
  .cat:last-child{margin-bottom:0;}
  .cat h3{
    font-family:var(--mono); font-size:10.5px; letter-spacing:2.5px; color:var(--cat-color, var(--muted));
    text-transform:uppercase; margin:0 0 11px; display:flex; align-items:center; gap:8px;
  }
  .cat h3::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--cat-color, var(--muted)); box-shadow:0 0 8px var(--cat-color, transparent);
  }
  .cat h3::after{
    content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent);
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;}
  .fx{
    position:relative; background:var(--glass); border:1px solid var(--line); border-radius:12px;
    padding:13px 13px 11px; cursor:pointer; text-align:left; color:var(--text);
    transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    overflow:hidden;
  }
  .fx::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:var(--cat-color, var(--muted)); opacity:0.55;
  }
  .fx:hover{border-color:var(--glass-strong); background:var(--glass-hover); transform:translateY(-2px);}
  .fx.selected{
    border-color:var(--cat-color, var(--cyan)); background:var(--glass-hover);
    box-shadow:0 0 0 1px var(--cat-color, var(--cyan)) inset, 0 0 22px -4px var(--cat-color, var(--cyan));
  }
  .fx.selected::before{opacity:1; height:3px;}
  .fx.processing{opacity:0.4; pointer-events:none;}
  .fx .name{font-family:var(--display); font-weight:600; font-size:14px; letter-spacing:0.2px; display:block;}
  .fx .desc{font-family:var(--body); font-size:11px; color:var(--muted); display:block; margin-top:3px; line-height:1.35;}
  .fx .star{
    position:absolute; top:9px; right:9px; font-size:13px; color:rgba(255,255,255,0.18);
    background:none; border:none; cursor:pointer; padding:2px; transition:color .15s ease, transform .15s ease;
  }
  .fx .star:hover{transform:scale(1.15);}
  .fx .star.on{color:var(--amber); text-shadow:0 0 8px rgba(255,180,84,0.7);}

  .preview-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);
  }
  .preview-name{font-family:var(--display); font-weight:600; font-size:17px; letter-spacing:0.2px;}
  .preview-name .cat-tag{
    font-family:var(--mono); font-size:9.5px; color:var(--cat-color, var(--cyan)); margin-left:9px;
    letter-spacing:1.5px; background:rgba(255,255,255,0.06); padding:3px 8px; border-radius:20px;
  }

  .intensity-row{
    display:flex; align-items:center; gap:12px; margin-top:16px;
    font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.3px;
  }
  .intensity-row input[type="range"]{
    flex:1; accent-color: var(--cat-color, var(--cyan));
    height:4px; cursor:pointer;
  }
  .intensity-value{ min-width:38px; text-align:right; color:var(--text); font-weight:500; }
  .intensity-status{ font-style:italic; opacity:0.75; min-width:70px; }

  .empty-state{
    font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; padding:34px 10px;
    letter-spacing:0.3px;
  }

  footer{
    position:relative; z-index:1;
    max-width:960px; margin:26px auto 0; font-family:var(--mono); font-size:9.5px;
    color:#565f78; text-align:center; letter-spacing:1.5px;
  }
</style>
</head>
<body>

  <div class="theme-switch" role="group" aria-label="Theme">
    <button class="theme-btn" id="lightModeBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Light mode
    </button>
    <button class="theme-btn active" id="darkModeBtn" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      Dark mode
    </button>
  </div>

  <div class="brand">
    <div class="brand-plate">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="9" width="2.4" height="6" rx="1.2" fill="white"/>
          <rect x="7" y="5" width="2.4" height="14" rx="1.2" fill="white"/>
          <rect x="12" y="1" width="2.4" height="22" rx="1.2" fill="white"/>
          <rect x="17" y="5" width="2.4" height="14" rx="1.2" fill="white"/>
          <rect x="22" y="9" width="2.4" height="6" rx="1.2" fill="white"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>WAVEBENDER</h1>
        <span class="sub">Voice FX Console</span>
      </div>
    </div>
    <button class="btn gold" id="installBtn" style="display:none; padding:8px 16px; font-size:11px;">⬇ Install App</button>
  </div>

  <div class="console">

    <!-- TRANSPORT -->
    <div class="module">
      <div class="module-label">Input <span class="tag" id="statusTag">idle</span></div>
      <div class="transport">
        <div class="transport-controls">
          <button class="btn record" id="recordBtn"><span class="dot"></span>Record</button>
          <button class="btn primary" id="pauseBtn" style="display:none;">⏸ Pause</button>
          <button class="btn" id="playOrigBtn" disabled>▶ Play Original</button>
          <button class="btn gold" id="shareOrigBtn" disabled>⤴ Share Original</button>
          <button class="btn" id="clearBtn" disabled>Clear</button>
        </div>
        <canvas id="scope" width="600" height="90"></canvas>
      </div>
      <div class="readout">
        <span>Length: <b id="lenReadout">00:00.0</b></span>
        <span>Sample rate: <b id="srReadout">—</b></span>
        <span>Mic: <b id="micReadout">not connected</b></span>
      </div>
    </div>

    <!-- EFFECTS -->
    <div class="module">
      <div class="module-label">Effect Bank <span class="tag" id="fxCount">24 patches</span></div>
      <div id="fxCategories"></div>
    </div>

    <!-- PREVIEW / EXPORT -->
    <div class="module" id="previewModule">
      <div class="module-label">Output</div>
      <div id="previewBody" class="empty-state">Record something, then tap an effect to hear it transformed.</div>
    </div>

  </div>

  <footer>ALL PROCESSING RUNS LOCALLY IN YOUR BROWSER · NOTHING IS UPLOADED</footer>

<script>
(() => {
  // ---------- State ----------
  let audioCtx = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let originalBuffer = null;   // decoded AudioBuffer
  let currentBuffer = null;    // last processed AudioBuffer (for export)
  let currentFxId = null;
  let playingSource = null;
  let analyser, analyserData, rafId;
  let favorites = new Set();
  let selectToken = 0; // guards against out-of-order effect renders

  const $ = (sel) => document.querySelector(sel);
  const recordBtn = $('#recordBtn');
  const pauseBtn = $('#pauseBtn');
  const playOrigBtn = $('#playOrigBtn');
  const shareOrigBtn = $('#shareOrigBtn');
  const clearBtn = $('#clearBtn');
  const statusTag = $('#statusTag');
  const lenReadout = $('#lenReadout');
  const srReadout = $('#srReadout');
  const micReadout = $('#micReadout');
  const scope = $('#scope');
  const scopeCtx = scope.getContext('2d');
  const previewBody = $('#previewBody');
  const fxCategoriesEl = $('#fxCategories');
  const lightModeBtn = $('#lightModeBtn');
  const darkModeBtn = $('#darkModeBtn');

  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume(); // iOS Safari can suspend the context if it wasn't resumed inside a direct tap handler
    return audioCtx;
  }

  function fmtTime(s){
    const m = Math.floor(s/60);
    const sec = (s%60).toFixed(1).padStart(4,'0');
    return `${String(m).padStart(2,'0')}:${sec}`;
  }

  // ---------- Effect definitions ----------
  // Each build(offlineCtx, buffer) returns { node: <last node in chain>, duration: <output seconds> }
  const EFFECTS = [
    // -- Pitch & Size --
    {id:'chipmunk', label:'Chipmunk', cat:'Pitch & Size', desc:'Fast + squeaky', rate:1.7},
    {id:'helium', label:'Helium', cat:'Pitch & Size', desc:'High & nasal', rate:1.9, filter:{type:'highpass', freq:500}},
    {id:'baby', label:'Baby Talk', cat:'Pitch & Size', desc:'High, narrow band', rate:1.6, filter:{type:'bandpass', freq:1800, Q:1.2}},
    {id:'deep', label:'Deep', cat:'Pitch & Size', desc:'Low & full', rate:0.68},
    {id:'giant', label:'Giant', cat:'Pitch & Size', desc:'Huge & booming', rate:0.55, filter:{type:'lowpass', freq:1800}},
    {id:'darklord', label:'Dark Lord', cat:'Pitch & Size', desc:'Menacing bass', rate:0.6, distortion:12, filter:{type:'lowpass', freq:2600}},

    // -- Speed --
    {id:'slowmo', label:'Slow Motion', cat:'Speed', desc:'Half speed', rate:0.5},
    {id:'fastforward', label:'Fast Forward', cat:'Speed', desc:'Double speed', rate:2.0},
    {id:'slurred', label:'Slurred', cat:'Speed', desc:'Dragging & warped', rate:0.8, wobble:{depth:0.04, freq:2}},

    // -- Character --
    {id:'robot', label:'Robot', cat:'Character', desc:'Ring-mod monotone', ringmod:36},
    {id:'robotmouse', label:'Robot Mouse', cat:'Character', desc:'High robotic squeak', rate:1.5, ringmod:55},
    {id:'alien', label:'Alien', cat:'Character', desc:'Wobbly & otherworldly', rate:1.15, wobble:{depth:0.12, freq:5}, filter:{type:'bandpass', freq:1400, Q:0.8}},
    {id:'evil', label:'Evil', cat:'Character', desc:'Distorted & sinister', rate:0.75, distortion:20, ringmod:14},
    {id:'ghost', label:'Ghost', cat:'Character', desc:'Airy, distant wail', rate:0.9, reverb:{duration:2.5, decay:4, wet:0.5}, tremolo:{depth:0.4, freq:1.3}},
    {id:'monster', label:'Monster', cat:'Character', desc:'Guttural growl', rate:0.5, distortion:30, filter:{type:'lowpass', freq:1200}},

    // -- Space & Ambience --
    {id:'echo', label:'Echo', cat:'Space & Ambience', desc:'Repeating delay', echo:{time:0.24, feedback:0.4, wet:0.55}, defaultIntensity:150},
    {id:'cave', label:'Cave', cat:'Space & Ambience', desc:'Long stone reverb', reverb:{duration:3.2, decay:3.5, wet:0.5}},
    {id:'cathedral', label:'Cathedral', cat:'Space & Ambience', desc:'Vast, holy reverb', reverb:{duration:4.5, decay:2.2, wet:0.5}},
    {id:'underwater', label:'Underwater', cat:'Space & Ambience', desc:'Muffled & swaying', filter:{type:'lowpass', freq:500}, wobble:{depth:0.05, freq:1.5}},

    // -- Lo-Fi & Texture --
    {id:'telephone', label:'Telephone', cat:'Lo-Fi & Texture', desc:'Old phone line', bandpassPair:{low:300, high:3000}},
    {id:'radio', label:'Radio', cat:'Lo-Fi & Texture', desc:'AM broadcast', bandpassPair:{low:500, high:2600}, distortion:8},
    {id:'megaphone', label:'Megaphone', cat:'Lo-Fi & Texture', desc:'Loud & blown out', bandpassPair:{low:600, high:3200}, distortion:18},
    {id:'vintagetape', label:'Vintage Tape', cat:'Lo-Fi & Texture', desc:'Warm wow & flutter', rate:0.97, wobble:{depth:0.01, freq:6}, filter:{type:'lowpass', freq:4200}},
    {id:'bitcrush', label:'Bit Crusher', cat:'Lo-Fi & Texture', desc:'Chunky & digital', bitcrush:5},

    // -- Novelty --
    {id:'reverse', label:'Reverse', cat:'Novelty', desc:'Plays backwards', reverse:true},
    {id:'fan', label:'Talking into Fan', cat:'Novelty', desc:'Choppy blade effect', tremolo:{depth:0.9, freq:11}},
    {id:'chorus', label:'Chorus', cat:'Novelty', desc:'Doubled voices', chorus:true},
    {id:'normal', label:'Normal', cat:'Novelty', desc:'Unprocessed', rate:1.0},
  ];

  function groupByCategory(list){
    const order = ['Pitch & Size','Speed','Character','Space & Ambience','Lo-Fi & Texture','Novelty'];
    const map = {};
    list.forEach(f => { (map[f.cat] = map[f.cat] || []).push(f); });
    return order.filter(c => map[c]).map(c => [c, map[c]]);
  }

  const CATEGORY_COLORS = {
    'Pitch & Size': 'var(--violet)',
    'Speed': 'var(--blue)',
    'Character': 'var(--magenta)',
    'Space & Ambience': 'var(--cyan)',
    'Lo-Fi & Texture': 'var(--amber)',
    'Novelty': 'var(--green)'
  };

  // ---------- Build UI ----------
  function renderFxBank(){
    fxCategoriesEl.innerHTML = '';
    groupByCategory(EFFECTS).forEach(([cat, items]) => {
      const catEl = document.createElement('div');
      catEl.className = 'cat';
      catEl.style.setProperty('--cat-color', CATEGORY_COLORS[cat] || 'var(--muted)');
      const h = document.createElement('h3');
      h.textContent = cat;
      catEl.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach(fx => {
        const card = document.createElement('div');
        card.className = 'fx';
        card.id = 'fx-' + fx.id;
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${fx.label} — ${fx.desc}`);
        card.innerHTML = `
          <button class="star ${favorites.has(fx.id)?'on':''}" data-fx="${fx.id}" title="Favorite">★</button>
          <span class="name">${fx.label}</span>
          <span class="desc">${fx.desc}</span>
        `;
        card.addEventListener('click', (e) => {
          if(e.target.classList.contains('star')) return;
          selectEffect(fx.id);
        });
        card.addEventListener('keydown', (e) => {
          if(e.target.classList.contains('star')) return;
          if(e.key === 'Enter' || e.key === ' '){
            e.preventDefault();
            selectEffect(fx.id);
          }
        });
        card.querySelector('.star').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(fx.id, e.target);
        });
        grid.appendChild(card);
      });
      catEl.appendChild(grid);
      fxCategoriesEl.appendChild(catEl);
    });
  }

  function toggleFavorite(id, el){
    if(favorites.has(id)){ favorites.delete(id); el.classList.remove('on'); }
    else { favorites.add(id); el.classList.add('on'); }
    saveFavorites();
  }

  async function saveFavorites(){
    try{
      if(window.storage){
        await window.storage.set('wavebender:favorites', JSON.stringify([...favorites]), false);
      }
    }catch(err){ console.warn('Could not save favorites', err); }
  }

  async function loadFavorites(){
    try{
      if(window.storage){
        const res = await window.storage.get('wavebender:favorites', false);
        if(res && res.value){ favorites = new Set(JSON.parse(res.value)); }
      }
    }catch(err){ /* no favorites yet */ }
  }

  // ---------- Theme ----------
  function applyTheme(mode){
    document.documentElement.setAttribute('data-theme', mode);
    lightModeBtn.classList.toggle('active', mode === 'light');
    darkModeBtn.classList.toggle('active', mode === 'dark');
    lightModeBtn.setAttribute('aria-pressed', String(mode === 'light'));
    darkModeBtn.setAttribute('aria-pressed', String(mode === 'dark'));
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content = mode === 'light' ? '#eef1fa' : '#06070c';
  }

  async function saveTheme(mode){
    try{
      if(window.storage) await window.storage.set('wavebender:theme', mode, false);
    }catch(err){ console.warn('Could not save theme', err); }
  }

  async function loadTheme(){
    try{
      if(window.storage){
        const res = await window.storage.get('wavebender:theme', false);
        if(res && res.value) return res.value;
      }
    }catch(err){ /* no saved theme yet, use default */ }
    return 'dark';
  }

  lightModeBtn.addEventListener('click', () => { applyTheme('light'); saveTheme('light'); });
  darkModeBtn.addEventListener('click', () => { applyTheme('dark'); saveTheme('dark'); });

  // ---------- Recording ----------
  recordBtn.addEventListener('click', async () => {
    if(recordBtn.classList.contains('active')){
      mediaRecorder.stop();
      return;
    }
    getCtx(); // create/resume the AudioContext synchronously inside this tap, before the await below
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micReadout.textContent = 'connected';
    }catch(err){
      micReadout.textContent = 'permission denied';
      statusTag.textContent = 'mic blocked';
      return;
    }
    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, {mimeType}) : new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable = (e) => { if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();

    recordBtn.classList.add('active');
    recordBtn.innerHTML = '<span class="dot"></span>Stop';
    pauseBtn.style.display = 'inline-flex';
    pauseBtn.innerHTML = '⏸ Pause';
    statusTag.textContent = 'recording…';
    playOrigBtn.disabled = true;
    clearBtn.disabled = true;

    startLiveScope();
  });

  pauseBtn.addEventListener('click', () => {
    if(!mediaRecorder) return;
    if(mediaRecorder.state === 'recording'){
      mediaRecorder.pause();
      pauseBtn.innerHTML = '▶ Resume';
      statusTag.textContent = 'paused';
      stopLiveScope(); // freeze the waveform so it's obvious recording isn't currently capturing
    }else if(mediaRecorder.state === 'paused'){
      mediaRecorder.resume();
      pauseBtn.innerHTML = '⏸ Pause';
      statusTag.textContent = 'recording…';
      drawLive(); // resume drawing using the same analyser — no need to reconnect the mic stream
    }
  });

  async function onRecordingStop(){
    recordBtn.classList.remove('active');
    recordBtn.innerHTML = '<span class="dot"></span>Record';
    pauseBtn.style.display = 'none';
    pauseBtn.innerHTML = '⏸ Pause';
    statusTag.textContent = 'decoding…';
    stopLiveScope();
    mediaStream.getTracks().forEach(t => t.stop());

    const blob = new Blob(recordedChunks, {type: recordedChunks[0]?.type || 'audio/webm'});
    const arrayBuffer = await blob.arrayBuffer();
    try{
      originalBuffer = await getCtx().decodeAudioData(arrayBuffer);
      lenReadout.textContent = fmtTime(originalBuffer.duration);
      srReadout.textContent = originalBuffer.sampleRate + ' Hz';
      statusTag.textContent = 'ready';
      micReadout.textContent = 'captured ✓';
      playOrigBtn.disabled = false;
      clearBtn.disabled = false;
      shareOrigBtn.disabled = false;
      drawStaticWaveform(originalBuffer);
      previewBody.innerHTML = '<div class="empty-state">Tap any effect above to preview it.</div>';
    }catch(err){
      statusTag.textContent = 'decode failed';
      micReadout.textContent = 'capture failed';
    }
  }

  clearBtn.addEventListener('click', () => {
    originalBuffer = null; currentBuffer = null; currentFxId = null;
    lenReadout.textContent = '00:00.0'; srReadout.textContent = '—';
    playOrigBtn.disabled = true; clearBtn.disabled = true; shareOrigBtn.disabled = true;
    statusTag.textContent = 'idle';
    micReadout.textContent = 'not connected';
    document.querySelectorAll('.fx.selected').forEach(el => el.classList.remove('selected'));
    previewBody.innerHTML = '<div class="empty-state">Record something, then tap an effect to hear it transformed.</div>';
    scopeCtx.clearRect(0,0,scope.width, scope.height);
  });

  playOrigBtn.addEventListener('click', () => playBuffer(originalBuffer));
  shareOrigBtn.addEventListener('click', () => shareBuffer(originalBuffer, 'wavebender-original', 'Original recording'));

  // ---------- Live scope while recording ----------
  function startLiveScope(){
    const ctx = getCtx();
    const src = ctx.createMediaStreamSource(mediaStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyserData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    drawLive();
  }
  function stopLiveScope(){ if(rafId) cancelAnimationFrame(rafId); }
  function drawLive(){
    rafId = requestAnimationFrame(drawLive);
    analyser.getByteTimeDomainData(analyserData);
    scopeCtx.clearRect(0,0,scope.width, scope.height);
    scopeCtx.lineWidth = 2;
    scopeCtx.strokeStyle = '#8b5cf6';
    scopeCtx.shadowColor = 'rgba(139,92,246,0.8)';
    scopeCtx.shadowBlur = 8;
    scopeCtx.beginPath();
    const slice = scope.width / analyserData.length;
    let x = 0;
    for(let i=0;i<analyserData.length;i++){
      const v = analyserData[i]/128.0;
      const y = v * scope.height/2;
      if(i===0) scopeCtx.moveTo(x,y); else scopeCtx.lineTo(x,y);
      x += slice;
    }
    scopeCtx.stroke();
  }

  function drawStaticWaveform(buffer){
    const data = buffer.getChannelData(0);
    const w = scope.width, h = scope.height;
    scopeCtx.clearRect(0,0,w,h);
    scopeCtx.strokeStyle = '#22e8d0';
    scopeCtx.shadowColor = 'rgba(34,232,208,0.6)';
    scopeCtx.shadowBlur = 6;
    scopeCtx.lineWidth = 1.5;
    scopeCtx.beginPath();
    const step = Math.ceil(data.length / w);
    for(let x=0; x<w; x++){
      let min=1, max=-1;
      for(let j=0;j<step;j++){
        const idx = x*step+j;
        if(idx<data.length){
          const v = data[idx];
          if(v<min) min=v;
          if(v>max) max=v;
        }
      }
      const y1 = (1+min)*h/2, y2=(1+max)*h/2;
      scopeCtx.moveTo(x,y1); scopeCtx.lineTo(x,y2);
    }
    scopeCtx.stroke();
  }

  // ---------- Effect processing ----------
  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  // Returns true if this effect has at least one parameter that the Intensity slider can adjust.
  function isTunable(fx){
    return !!(fx.echo || fx.reverb || fx.distortion || fx.tremolo);
  }

  // Produces a shallow-cloned effect config with its "wetness" parameters scaled by intensity
  // (1.0 = the effect's normal default). Used so the Intensity slider can make an effect like
  // Echo louder/quieter, or Evil more/less distorted, without touching pitch/speed/filters.
  function scaleEffectParams(fx, intensity){
    const scaled = {...fx};
    if(fx.echo){
      scaled.echo = {
        time: fx.echo.time,
        feedback: clamp(fx.echo.feedback * intensity, 0, 0.85),
        wet: clamp((fx.echo.wet ?? 0.55) * intensity, 0, 1.2)
      };
    }
    if(fx.reverb){
      scaled.reverb = {
        duration: fx.reverb.duration,
        decay: fx.reverb.decay,
        wet: clamp((fx.reverb.wet ?? 0.5) * intensity, 0, 1.2)
      };
    }
    if(fx.distortion){
      scaled.distortion = clamp(fx.distortion * intensity, 1, 80);
    }
    if(fx.tremolo){
      scaled.tremolo = { freq: fx.tremolo.freq, depth: clamp(fx.tremolo.depth * intensity, 0.05, 0.95) };
    }
    return scaled;
  }

  function makeDistortionCurve(amount){
    const k = amount, n = 44100;
    const curve = new Float32Array(n);
    for(let i=0;i<n;i++){
      const x = i*2/n - 1;
      curve[i] = (3+k)*x*20*(Math.PI/180) / (Math.PI + k*Math.abs(x));
    }
    return curve;
  }

  function makeBitcrushCurve(bits){
    const steps = Math.pow(2, bits);
    const n = 1024;
    const curve = new Float32Array(n);
    for(let i=0;i<n;i++){
      const x = i*2/n - 1;
      curve[i] = Math.round(x*steps)/steps;
    }
    return curve;
  }

  function generateImpulse(ctx, duration, decay){
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate*duration));
    const impulse = ctx.createBuffer(2, length, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<length;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
      }
    }
    return impulse;
  }

  function reverseBuffer(ctx, buffer){
    const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
    for(let ch=0; ch<buffer.numberOfChannels; ch++){
      const src = buffer.getChannelData(ch);
      const dst = out.getChannelData(ch);
      for(let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
    }
    return out;
  }

  async function renderEffect(fx, srcBuffer){
    if(fx.reverse){
      // reverse needs no offline render, just flip a copy
      return reverseBuffer(getCtx(), srcBuffer);
    }

    const rate = fx.rate || 1.0;
    const tailPad = (fx.reverb ? fx.reverb.duration + 0.5 : (fx.echo ? 1.0 + (fx.echo.feedback * 4) : 0.1));
    const outLength = Math.ceil((srcBuffer.length / rate) + tailPad * srcBuffer.sampleRate);
    const offline = new OfflineAudioContext(srcBuffer.numberOfChannels, outLength, srcBuffer.sampleRate);

    const source = offline.createBufferSource();
    source.buffer = srcBuffer;
    source.playbackRate.value = rate;

    if(fx.wobble){
      const dur = srcBuffer.duration / rate;
      const steps = Math.max(2, Math.floor(dur * 20));
      const curve = new Float32Array(steps);
      for(let i=0;i<steps;i++){
        const t = i/steps*dur;
        curve[i] = rate * (1 + fx.wobble.depth * Math.sin(2*Math.PI*fx.wobble.freq*t));
      }
      source.playbackRate.setValueCurveAtTime(curve, 0, dur);
    }

    let node = source;

    if(fx.filter){
      const f = offline.createBiquadFilter();
      f.type = fx.filter.type;
      f.frequency.value = fx.filter.freq;
      if(fx.filter.Q) f.Q.value = fx.filter.Q;
      node.connect(f); node = f;
    }

    if(fx.bandpassPair){
      const hp = offline.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = fx.bandpassPair.low;
      const lp = offline.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = fx.bandpassPair.high;
      node.connect(hp); hp.connect(lp); node = lp;
    }

    if(fx.ringmod){
      const osc = offline.createOscillator();
      osc.frequency.value = fx.ringmod;
      const ringGain = offline.createGain();
      ringGain.gain.value = 0;
      osc.connect(ringGain.gain);
      const mixGain = offline.createGain();
      mixGain.gain.value = 1;
      node.connect(mixGain);
      mixGain.connect(ringGain);
      osc.start(0);
      node = ringGain;
    }

    if(fx.tremolo){
      const osc = offline.createOscillator();
      osc.frequency.value = fx.tremolo.freq;
      const depthGain = offline.createGain();
      depthGain.gain.value = fx.tremolo.depth;
      const trem = offline.createGain();
      trem.gain.value = 1 - fx.tremolo.depth;
      osc.connect(depthGain);
      depthGain.connect(trem.gain);
      node.connect(trem);
      osc.start(0);
      node = trem;
    }

    if(fx.distortion){
      const shaper = offline.createWaveShaper();
      shaper.curve = makeDistortionCurve(fx.distortion);
      shaper.oversample = '2x';
      node.connect(shaper); node = shaper;
    }

    if(fx.bitcrush){
      const shaper = offline.createWaveShaper();
      shaper.curve = makeBitcrushCurve(fx.bitcrush);
      node.connect(shaper); node = shaper;
    }

    if(fx.echo){
      const delay = offline.createDelay(2.0);
      delay.delayTime.value = fx.echo.time;
      const feedback = offline.createGain();
      feedback.gain.value = fx.echo.feedback;
      const wet = offline.createGain();
      wet.gain.value = fx.echo.wet ?? 0.55;
      const merge = offline.createGain();
      node.connect(merge);
      node.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(merge);
      node = merge;
    }

    if(fx.chorus){
      const merge = offline.createGain();
      node.connect(merge);
      [0.018, 0.027].forEach((t, idx) => {
        const d = offline.createDelay(0.05);
        d.delayTime.value = t;
        const osc = offline.createOscillator();
        osc.frequency.value = 0.6 + idx*0.3;
        const depth = offline.createGain();
        depth.gain.value = 0.004;
        osc.connect(depth); depth.connect(d.delayTime);
        const g = offline.createGain(); g.gain.value = 0.5;
        node.connect(d); d.connect(g); g.connect(merge);
        osc.start(0);
      });
      node = merge;
    }

    if(fx.reverb){
      const convolver = offline.createConvolver();
      convolver.buffer = generateImpulse(offline, fx.reverb.duration, fx.reverb.decay);
      const wet = offline.createGain(); wet.gain.value = fx.reverb.wet ?? 0.5;
      const dry = offline.createGain(); dry.gain.value = 0.7;
      const merge = offline.createGain();
      node.connect(dry); dry.connect(merge);
      node.connect(convolver); convolver.connect(wet); wet.connect(merge);
      node = merge;
    }

    node.connect(offline.destination);
    source.start(0);
    return await offline.startRendering();
  }

  // ---------- Selection / playback ----------
  async function selectEffect(id){
    if(!originalBuffer) return;
    const myToken = ++selectToken; // this call is now the "latest" request

    document.querySelectorAll('.fx.selected').forEach(el => el.classList.remove('selected'));
    const card = document.getElementById('fx-' + id);
    card.classList.add('selected');
    card.classList.add('processing');
    previewBody.innerHTML = '<div class="empty-state">Rendering effect…</div>';

    const fx = EFFECTS.find(f => f.id === id);
    const startIntensity = fx.defaultIntensity ?? 100; // some effects (like Echo) start louder than "neutral" 100%
    try{
      const scaledFx = scaleEffectParams(fx, startIntensity / 100);
      const result = await renderEffect(scaledFx, originalBuffer);
      if(myToken !== selectToken){ card.classList.remove('processing'); return; } // a newer tap arrived first — drop this stale result
      currentBuffer = result;
      currentFxId = id;
      card.classList.remove('processing');
      renderPreview(fx, result, startIntensity);
      drawStaticWaveform(result);
    }catch(err){
      if(myToken !== selectToken) return;
      card.classList.remove('processing');
      previewBody.innerHTML = '<div class="empty-state">Could not render this effect: ' + err.message + '</div>';
    }
  }

  // Re-renders the currently selected effect at a new intensity (called when the slider is released).
  // Deliberately does not rebuild the whole preview panel, so the slider itself doesn't jump or lose focus.
  async function reRenderIntensity(fx, intensityPercent, statusEl){
    if(!originalBuffer) return;
    const myToken = ++selectToken;
    if(statusEl) statusEl.textContent = 'Rendering…';
    try{
      const scaledFx = scaleEffectParams(fx, intensityPercent / 100);
      const result = await renderEffect(scaledFx, originalBuffer);
      if(myToken !== selectToken) return; // a newer action (new effect tap, or another slider move) wins
      currentBuffer = result;
      drawStaticWaveform(result);
      if(statusEl) statusEl.textContent = '';
      playBuffer(result); // instant feedback so you can hear the new level right away
    }catch(err){
      if(myToken !== selectToken) return;
      if(statusEl) statusEl.textContent = 'Could not render';
    }
  }

  function renderPreview(fx, buffer, intensityPercent){
    intensityPercent = intensityPercent ?? 100;
    previewBody.style.setProperty('--cat-color', CATEGORY_COLORS[fx.cat] || 'var(--cyan)');
    const tunable = isTunable(fx);
    previewBody.innerHTML = `
      <div class="preview-bar">
        <div>
          <div class="preview-name">${fx.label}<span class="cat-tag">${fx.cat.toUpperCase()}</span></div>
        </div>
        <div class="transport-controls">
          <button class="btn primary" id="playFxBtn">▶ Play</button>
          <button class="btn gold" id="shareFxBtn">⤴ Share</button>
          <button class="btn gold" id="downloadBtn">⬇ Save WAV</button>
        </div>
      </div>
      ${tunable ? `
      <div class="intensity-row">
        <span>Intensity</span>
        <input type="range" id="intensitySlider" min="0" max="200" step="5" value="${intensityPercent}" aria-label="Effect intensity">
        <span class="intensity-value" id="intensityValue">${intensityPercent}%</span>
        <span class="intensity-status" id="intensityStatus"></span>
      </div>` : ''}
    `;
    // These read currentBuffer (not the buffer argument) so Play/Share/Save always reflect
    // the latest intensity adjustment, even after the slider changes it.
    $('#playFxBtn').addEventListener('click', () => playBuffer(currentBuffer));
    $('#shareFxBtn').addEventListener('click', () => shareBuffer(currentBuffer, `wavebender-${fx.id}`, fx.label));
    $('#downloadBtn').addEventListener('click', () => downloadWav(currentBuffer, `wavebender-${fx.id}`));

    if(tunable){
      const slider = $('#intensitySlider');
      const valueLabel = $('#intensityValue');
      const statusEl = $('#intensityStatus');
      slider.addEventListener('input', () => { valueLabel.textContent = slider.value + '%'; });
      slider.addEventListener('change', () => { reRenderIntensity(fx, Number(slider.value), statusEl); });
    }
  }

  function playBuffer(buffer){
    if(!buffer) return;
    if(playingSource){ try{ playingSource.stop(); }catch(e){} }
    const ctx = getCtx();
    if(ctx.state === 'suspended') ctx.resume();
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start(0);
    playingSource = src;
  }

  // ---------- WAV export ----------
  function audioBufferToWav(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 16;
    const bytesPerSample = bitDepth/8;
    const blockAlign = numChannels * bytesPerSample;

    const chans = [];
    for(let i=0;i<numChannels;i++) chans.push(buffer.getChannelData(i));
    const dataLength = buffer.length * blockAlign;
    const bufferArr = new ArrayBuffer(44 + dataLength);
    const view = new DataView(bufferArr);

    function writeStr(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }

    writeStr(0,'RIFF');
    view.setUint32(4, 36+dataLength, true);
    writeStr(8,'WAVE');
    writeStr(12,'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate*blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeStr(36,'data');
    view.setUint32(40, dataLength, true);

    let offset = 44;
    for(let i=0;i<buffer.length;i++){
      for(let ch=0; ch<numChannels; ch++){
        let sample = Math.max(-1, Math.min(1, chans[ch][i]));
        sample = sample < 0 ? sample*0x8000 : sample*0x7FFF;
        view.setInt16(offset, sample, true);
        offset += 2;
      }
    }
    return new Blob([view], {type:'audio/wav'});
  }

  function downloadWav(buffer, name){
    const blob = audioBufferToWav(buffer);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}.wav`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ---------- Share ----------
  let toastTimer = null;
  function showToast(msg){
    let toast = document.getElementById('wbToast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'wbToast';
      toast.style.cssText = `
        position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
        background:rgba(20,22,32,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
        border:1px solid rgba(255,255,255,0.12); color:#f3f5fb;
        font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.4px;
        padding:11px 18px; border-radius:999px; box-shadow:0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.15);
        z-index:9999; opacity:0; transition:opacity .2s ease; pointer-events:none;
      `;
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2600);
  }

  async function shareBuffer(buffer, filenameBase, label){
    if(!buffer) return;
    const blob = audioBufferToWav(buffer);
    const fileName = `${filenameBase}.wav`;

    // Try native file sharing (Android Chrome, iOS Safari 15+, most mobile browsers)
    try{
      const file = new File([blob], fileName, {type:'audio/wav'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title:'WAVEBENDER',
          text:`${label} — made with WAVEBENDER`
        });
        return;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return; // user cancelled the share sheet, do nothing
      console.warn('File share failed, falling back to download', err);
    }

    // Fallback for desktop browsers / older devices with no file-share support
    downloadWav(buffer, filenameBase);
    showToast('Sharing isn\'t supported here — saved the file instead.');
  }

  // ---------- Install as app ----------
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const installBtn = document.getElementById('installBtn');
    if(installBtn) installBtn.style.display = 'inline-flex';
  });

  function wireInstallButton(){
    const installBtn = document.getElementById('installBtn');
    if(!installBtn) return;
    installBtn.addEventListener('click', async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = 'none';
    });
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed', err);
      });
    });
  }

  // ---------- Init ----------
  renderFxBank();
  wireInstallButton();
  loadFavorites().then(renderFxBank);
  loadTheme().then(applyTheme);
})();
</script>
</body>
</html>
